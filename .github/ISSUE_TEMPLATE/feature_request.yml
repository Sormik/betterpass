name: Feature request / Idee
description: Suggest an idea for BetterPass. / Eine Idee für BetterPass vorschlagen.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
