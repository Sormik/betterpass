name: Bug report / Fehlerbericht
description: Something does not work as expected. / Etwas funktioniert nicht wie erwartet.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** please do not report them here, see SECURITY.md.
        English or German is fine. Never post real passwords or TOTP secrets.
  - type: input
    id: betterpass
    attributes:
      label: BetterPass version
      description: Tools → Plugins in KeePass
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: keepass
    attributes:
      label: KeePass version
      placeholder: "2.62"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: log
    attributes:
      label: Error messages
      description: If KeePass reports an error when loading the plugin, start it with `KeePass.exe --debug` and paste the compiler messages from the Temp folder.
      render: text
